<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مساعد Gemini الذكي</title>
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #121212 !important;
            color: #ffffff !important;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* الشريط العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #121212;
            border-bottom: 1px solid #1f1f1f;
        }

        .top-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .api-key-btn {
            background-color: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .model-badge {
            background-color: #2e265c;
            color: #a78bfa;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* النافذة المنبثقة مفتاح API */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content h3 { font-size: 18px; color: #fff; }
        .modal-content p { font-size: 13px; color: #a1a1aa; line-height: 1.4; }

        .modal-content input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #121212;
            color: #fff;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .save-btn {
            background-color: #a78bfa;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .close-btn {
            background-color: transparent;
            color: #a1a1aa;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
        }

        /* منطقة الشات */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .welcome-screen {
            margin: auto;
            text-align: center;
        }

        .welcome-screen h1 {
            font-size: 22px;
            font-weight: 500;
            color: #e5e5e5;
        }

        .messages-list {
            width: 100%;
            max-width: 768px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 15px;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: #2a2a2a;
            align-self: flex-start;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background-color: #1e1e1e;
            align-self: flex-end;
            color: #d1d5db;
            border-bottom-left-radius: 4px;
            border: 1px solid #2e2e2e;
        }

        /* منطقة الإدخال */
        .input-container {
            padding: 8px 12px 16px;
            background-color: #121212;
            display: flex;
            justify-content: center;
        }

        .input-box {
            width: 100%;
            max-width: 768px;
            background-color: #1e1e1e;
            border: 1px solid #2e2e2e;
            border-radius: 20px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-box textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            resize: none;
            outline: none;
            font-size: 15px;
            max-height: 120px;
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left-actions, .right-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-name {
            color: #a78bfa;
            font-size: 13px;
            font-weight: 500;
        }

        .send-btn {
            background-color: #a78bfa;
            color: #000;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
        }

        .send-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="top-bar">
        <button class="icon-btn" type="button"><i class="fa-solid fa-bars"></i></button>
        <div class="top-buttons">
            <button class="api-key-btn" id="openKeyModalBtn" type="button"><i class="fa-solid fa-key"></i> Gemini API Key</button>
            <div class="model-badge"><i class="fa-solid fa-wand-magic-sparkles"></i> Gemini 2.5 Flash</div>
        </div>
    </header>

    <!-- نافذة إدخال API Key -->
    <div class="modal" id="keyModal">
        <div class="modal-content">
            <h3>إعدادات Gemini API Key</h3>
            <p>أدخل مفتاح Google Gemini API الخاص بك. يتم حفظ المفتاح بأمان داخل متصفحك فقط.</p>
            <input type="password" id="userApiKeyInput" placeholder="AIzaSy..." />
            <div class="modal-actions">
                <button id="saveKeyBtn" class="save-btn" type="button">حفظ</button>
                <button id="closeModalBtn" class="close-btn" type="button">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- منطقة الشات -->
    <main class="chat-container" id="chatContainer">
        <div class="welcome-screen" id="welcomeScreen">
            <h1>مرحباً بك! كيف يمكن لـ Gemini مساعدتك اليوم؟</h1>
        </div>
        <div class="messages-list" id="messagesList"></div>
    </main>

    <!-- شريط الإدخال السفلي -->
    <footer class="input-container">
        <div class="input-box">
            <textarea id="userInput" rows="1" placeholder="اسأل، تعلّم، تبادل الأفكار مع Gemini..."></textarea>
            <div class="input-actions">
                <div class="left-actions">
                    <span class="model-name"><i class="fa-solid fa-bolt"></i> Google Gemini</span>
                </div>
                <div class="right-actions">
                    <button class="send-btn" id="sendBtn" type="button"><i class="fa-solid fa-arrow-up"></i></button>
                </div>
            </div>
        </div>
    </footer>

    <!-- منطق البرمجة والجافاسكربت -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const chatContainer = document.getElementById('chatContainer');
            const welcomeScreen = document.getElementById('welcomeScreen');
            const messagesList = document.getElementById('messagesList');

            const keyModal = document.getElementById('keyModal');
            const openKeyModalBtn = document.getElementById('openKeyModalBtn');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const saveKeyBtn = document.getElementById('saveKeyBtn');
            const userApiKeyInput = document.getElementById('userApiKeyInput');

            // فتح النافذة المنبثقة للمفتاح
            if (openKeyModalBtn) {
                openKeyModalBtn.addEventListener('click', () => {
                    userApiKeyInput.value = localStorage.getItem('custom_gemini_key') || '';
                    keyModal.style.display = 'flex';
                });
            }

            // إغلاق النافذة
            if (closeModalBtn) {
                closeModalBtn.addEventListener('click', () => {
                    keyModal.style.display = 'none';
                });
            }

            // حفظ المفتاح في LocalStorage
            if (saveKeyBtn) {
                saveKeyBtn.addEventListener('click', () => {
                    const key = userApiKeyInput.value.trim();
                    if (key) {
                        localStorage.setItem('custom_gemini_key', key);
                        alert('تم حفظ المفتاح بنجاح!');
                    } else {
                        localStorage.removeItem('custom_gemini_key');
                        alert('تم إزالة المفتاح.');
                    }
                    keyModal.style.display = 'none';
                });
            }

            // التكيف التلقائي لارتفاع مربع النص
            if (userInput) {
                userInput.addEventListener('input', () => {
                    userInput.style.height = 'auto';
                    userInput.style.height = (userInput.scrollHeight) + 'px';
                });

                userInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleSend();
                    }
                });
            }

            if (sendBtn) {
                sendBtn.addEventListener('click', handleSend);
            }

            async function handleSend() {
                const text = userInput.value.trim();
                if (!text) return;

                if (welcomeScreen) welcomeScreen.style.display = 'none';

                appendMessage(text, 'user-message');
                userInput.value = '';
                userInput.style.height = 'auto';

                const loadingId = appendMessage("جاري التفكير...", 'bot-message');
                const customKey = localStorage.getItem('custom_gemini_key');

                if (!customKey) {
                    document.getElementById(loadingId).innerText = "يرجى الضغط على زر (Gemini API Key) في الأعلى وإدخال المفتاح الخاص بك للبدء.";
                    return;
                }

                try {
                    // رابط الاتصال بموديل Gemini 2.5 Flash
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${customKey}`;
                    
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: text }] }]
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        const reply = data.candidates[0].content.parts[0].text;
                        document.getElementById(loadingId).innerText = reply;
                    } else {
                        document.getElementById(loadingId).innerText = "خطأ: " + (data.error?.message || "تأكد من صحة المفتاح الخاص بك.");
                    }

                } catch (error) {
                    console.error(error);
                    document.getElementById(loadingId).innerText = "حدث خطأ أثناء الاتصال بالخادم.";
                }
            }

            function appendMessage(text, className) {
                const msgDiv = document.createElement('div');
                const id = 'msg-' + Date.now();
                msgDiv.id = id;
                msgDiv.className = `message ${className}`;
                msgDiv.innerText = text;
                messagesList.appendChild(msgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return id;
            }
        });
    </script>
</body>
</html>
