<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <button class="icon-btn"><i class="fa-solid fa-bars"></i></button>
        <div class="top-buttons">
            <button class="api-key-btn" id="openKeyModalBtn"><i class="fa-solid fa-key"></i> إدخال API Key</button>
            <button class="upgrade-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> خطة الترقية</button>
        </div>
    </header>

    <!-- نافذة إدخال API Key -->
    <div class="modal" id="keyModal">
        <div class="modal-content">
            <h3>إعدادات API Key الخاص بك</h3>
            <p>أدخل مفتاح OpenAI الخاص بك ليتم استخدامه في المحادثات. سيتم حفظه محلياً في متصفحك فقط.</p>
            <input type="password" id="userApiKeyInput" placeholder="sk-proj-..." />
            <div class="modal-actions">
                <button id="saveKeyBtn" class="save-btn">حفظ</button>
                <button id="closeModalBtn" class="close-btn">إلغاء</button>
            </div>
        </div>
    </div>

    <main class="chat-container" id="chatContainer">
        <div class="welcome-screen" id="welcomeScreen">
            <h1>ما الذي يمكنني مساعدتك به اليوم؟</h1>
        </div>
        <div class="messages-list" id="messagesList"></div>
    </main>

    <footer class="input-container">
        <div class="input-box">
            <textarea id="userInput" rows="1" placeholder="اسأل، تعلّم، تبادل الأفكار..."></textarea>
            <div class="input-actions">
                <div class="left-actions">
                    <button class="action-btn"><i class="fa-solid fa-plus"></i></button>
                    <button class="action-btn"><i class="fa-regular fa-comment-dots"></i> <i class="fa-solid fa-chevron-down text-xs"></i></button>
                    <button class="action-btn"><i class="fa-solid fa-desktop"></i></button>
                </div>
                <div class="right-actions">
                    <button class="model-select-btn">نموذج <i class="fa-solid fa-chevron-down text-xs"></i></button>
                    <button class="send-btn" id="sendBtn"><i class="fa-solid fa-arrow-up"></i></button>
                </div>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
