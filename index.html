<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ذكاء - مساعدك الذكي</title>
<style>
:root{
  --bg:#0f1117; --panel:#1a1d27; --panel2:#232735; --border:#2e3345;
  --text:#e8eaf2; --muted:#8b90a5; --accent:#6c5ce7; --accent2:#8b7cf7;
  --user-bg:#6c5ce7; --bot-bg:#232735; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* شاشة إدخال المفتاح */
#keyScreen{position:fixed;inset:0;background:linear-gradient(135deg,#0f1117 0%,#1a1d35 100%);display:flex;align-items:center;justify-content:center;z-index:100}
.key-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:48px 40px;max-width:440px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.key-card .logo{font-size:52px;margin-bottom:12px}
.key-card h1{font-size:26px;margin-bottom:8px}
.key-card p{color:var(--muted);font-size:14px;line-height:1.8;margin-bottom:24px}
.key-card input{width:100%;padding:14px 16px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;margin-bottom:8px;outline:none;transition:.2s}
.key-card input:focus{border-color:var(--accent)}
.key-card button{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;transition:.2s}
.key-card button:hover{opacity:.9;transform:translateY(-1px)}
.key-error{color:#ff6b6b;font-size:13px;margin-top:10px;min-height:18px}
.key-note{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.7}

/* الهيدر */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
header .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
header .brand span.dot{width:10px;height:10px;background:#00d26a;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
header .actions{display:flex;gap:8px}
.btn-icon{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
.btn-icon:hover{border-color:var(--accent)}

/* منطقة المحادثة */
#chat{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
#chat::-webkit-scrollbar{width:6px}
#chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.msg{display:flex;gap:10px;max-width:75%;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.msg.user .avatar{background:var(--user-bg)}
.msg.bot .avatar{background:var(--panel2);border:1px solid var(--border)}
.msg .bubble{padding:12px 16px;border-radius:var(--radius);line-height:1.9;font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--user-bg);color:#fff;border-bottom-left-radius:4px}
.msg.bot .bubble{background:var(--bot-bg);border:1px solid var(--border);border-bottom-right-radius:4px}
.msg .bubble code{background:#0f1117;padding:2px 6px;border-radius:4px;font-size:13px;direction:ltr;display:inline-block}
.typing{display:flex;gap:5px;padding:6px 2px}
.typing span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:blink 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* الإدخال */
#inputBar{display:flex;gap:10px;padding:16px 20px;background:var(--panel);border-top:1px solid var(--border)}
#userInput{flex:1;padding:14px 18px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;resize:none;outline:none;max-height:150px;font-family:inherit;transition:.2s}
#userInput:focus{border-color:var(--accent)}
#sendBtn{width:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;color:#fff;font-size:20px;cursor:pointer;transition:.2s}
#sendBtn:hover{opacity:.9}
#sendBtn:disabled{opacity:.4;cursor:not-allowed}

@media(max-width:600px){.msg{max-width:90%}}
</style>
</head>
<body>

<!-- شاشة إدخال مفتاح OpenAI -->
<div id="keyScreen">
  <div class="key-card">
    <div class="logo">🤖</div>
    <h1>مرحباً بك في ذكاء</h1>
    <p>لبدء المحادثة مع الذكاء الاصطناعي، يرجى إدخال مفتاح OpenAI API الخاص بك.</p>
    <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
    <button onclick="saveKey()">بدء المحادثة</button>
    <div class="key-error" id="keyError"></div>
    <div class="key-note">🔒 مفتاحك يُحفظ محلياً في متصفحك فقط ولا يُرسل لأي خادم غير OpenAI. يمكنك الحصول على مفتاح من platform.openai.com</div>
  </div>
</div>

<!-- الهيدر -->
<header>
  <div class="brand"><span class="dot"></span> ذكاء - المساعد الذكي</div>
  <div class="actions">
    <button class="btn-icon" onclick="newChat()">محادثة جديدة</button>
    <button class="btn-icon" onclick="changeKey()">تغيير المفتاح</button>
  </div>
</header>

<!-- المحادثة -->
<div id="chat"></div>

<!-- شريط الإدخال -->
<div id="inputBar">
  <textarea id="userInput" rows="1" placeholder="اكتب رسالتك هنا..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
const API_URL = "https://api.openai.com/v1/chat/completions";
const MODEL = "gpt-4o-mini";
let apiKey = null;
let messages = []; // سجل المحادثة الكامل

// ===== إدارة المفتاح =====
function saveKey(){
  const input = document.getElementById("apiKeyInput").value.trim();
  const err = document.getElementById("keyError");
  if(!input.startsWith("sk-") || input.length < 20){
    err.textContent = "⚠ المفتاح غير صالح، يجب أن يبدأ بـ sk-";
    return;
  }
  err.textContent = "";
  apiKey = input;
  localStorage.setItem("openai_key", input);
  document.getElementById("keyScreen").style.display = "none";
  addBotMessage("مرحباً! 👋 أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟");
}

function changeKey(){
  localStorage.removeItem("openai_key");
  apiKey = null;
  document.getElementById("keyScreen").style.display = "flex";
  document.getElementById("apiKeyInput").value = "";
}

// عند التحميل: استرجاع المفتاح المحفوظ
window.addEventListener("load", () => {
  const saved = localStorage.getItem("openai_key");
  if(saved){
    apiKey = saved;
    document.getElementById("keyScreen").style.display = "none";
    addBotMessage("مرحباً بعودتك! 👋 كيف يمكنني مساعدتك؟");
  }
});

// ===== المحادثة =====
function addUserMessage(text){
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="avatar">🧑</div><div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addBotMessage(text){
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div.querySelector(".bubble");
}

function showTyping(){
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg bot"; div.id = "typing";
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){
  const t = document.getElementById("typing");
  if(t) t.remove();
}

// إرسال الرسالة والاتصال بـ OpenAI
async function sendMessage(){
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if(!text || !apiKey) return;

  input.value = ""; autoResize(input);
  setBusy(true);
  addUserMessage(text);
  showTyping();
  messages.push({role:"user", content:text});

  try{
    const res = await fetch(API_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + apiKey
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          {role:"system", content:"أنت مساعد ذكي ودود يجيب باللغة العربية بشكل واضح ومفيد."}, // تعليمات النظام
          ...messages
        ],
        temperature: 0.7,
        max_tokens: 2000
      })
    });

    if(!res.ok){
      const e = await res.json().catch(()=>({}));
      throw new Error(e.error?.message || `خطأ HTTP ${res.status}`);
    }

    const data = await res.json();
    const reply = data.choices[0].message.content;
    messages.push({role:"assistant", content:reply});
    removeTyping();
    addBotMessage(reply);
  }catch(err){
    removeTyping();
    addBotMessage("❌ حدث خطأ: " + err.message);
  }finally{
    setBusy(false);
    document.getElementById("userInput").focus();
  }
}

function setBusy(b){
  document.getElementById("sendBtn").disabled = b;
}

// ===== أدوات مساعدة =====
function newChat(){
  messages = [];
  document.getElementById("chat").innerHTML = "";
  addBotMessage("بدأت محادثة جديدة! ✨ كيف يمكنني مساعدتك؟");
}

function handleKey(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el){
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 150) + "px";
}
</script>
</body>
</html>
